name: Check site

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build.py --check
      - run: node --check assets/js/boot.js
      - run: node --check assets/js/site.js
      - run: node --check assets/js/navigation.js

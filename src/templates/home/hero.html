  <!-- HERO -->
  <section class="hero" id="hero" data-hud="${hero_hud}">
    <div class="stage">
      <img class="dw d-turbine" src="${hero_turbine_image}" alt="">
      <img class="dw d-target" src="${hero_target_image}" alt="">
      <img class="dw d-injector" src="${hero_injector_image}" alt="">
      <img class="dw d-rocket" src="${hero_rocket_image}" alt="">
      <div class="head">
        <span class="wm"><b>${site_name}</b><small>${site_full_name}</small></span>
        <h1>${hero_title}<span>${hero_subtitle}</span></h1>
      </div>
      <div class="hero-plate" id="heroPlate">
        <div class="pf">
          <div class="pi"><img src="${hero_image}" width="1030" height="630" alt="${hero_image_alt}" fetchpriority="high"><div class="shade" id="shade"></div></div>
        </div>
      </div>
      <div class="hint" id="hint"><span class="mono up">${hero_scroll_hint}</span><i></i></div>
    </div>
    <div class="over" id="over">
      <h2><span class="l"><span>${hero_headline_1}</span></span><span class="l"><span>${hero_headline_2}</span></span><span class="l"><span><em>${hero_headline_3}</em></span></span></h2>
    </div>
  </section>
